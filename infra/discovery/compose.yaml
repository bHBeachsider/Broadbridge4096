name: broadbridge-voice
services:
  interviewer:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    # Model API is available only to containers on this private network.
    # No host port is published.
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - interviewer-models:/root/.ollama
    mem_limit: 4g
    cpus: 6
    restart: "no"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
  speech:
    build: .
    image: broadbridge-voice-speech:local-v1
    profiles: ["tools"]
    environment:
      VOICE_OLLAMA_URL: "http://interviewer:11434"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: "/models/huggingface"
      OMP_NUM_THREADS: "4"
    volumes:
      - speech-models:/models:ro
      - ./runtime:/work
    read_only: true
    # phonemizer clones libespeak into a temporary directory before dlopen.
    tmpfs: ["/tmp:rw,exec,nosuid,nodev,size=256m"]
    mem_limit: 4g
    cpus: 6
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
networks:
  default:
    internal: true
volumes:
  interviewer-models:
  speech-models:
