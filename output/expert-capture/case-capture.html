<title>Broadbridge Case Capture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F6F7F5; --panel:#FFFFFF; --ink:#1E252E; --ink-2:#55606C; --ink-3:#8A94A0;
  --rule:#CBD1D8; --rule-soft:#E4E8EC; --accent:#2B5D86; --accent-ink:#FFFFFF; --accent-soft:#E6EEF5;
  --ok:#2E7D4F; --ok-soft:#E3F1E8; --warn:#B26A1B; --warn-soft:#F7EBDD; --bad:#A63A2E;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --paper:#151A1F; --panel:#1C2229; --ink:#E6E9EC; --ink-2:#A8B1BA; --ink-3:#727C87;
  --rule:#343D47; --rule-soft:#2A323B; --accent:#6FA3D2; --accent-ink:#0F1A24; --accent-soft:#213445;
  --ok:#6CC08F; --ok-soft:#1F3428; --warn:#E0A05A; --warn-soft:#3A2C1A; --bad:#E07A6E; } }
:root[data-theme="dark"]{
  color-scheme:dark; --paper:#151A1F; --panel:#1C2229; --ink:#E6E9EC; --ink-2:#A8B1BA; --ink-3:#727C87;
  --rule:#343D47; --rule-soft:#2A323B; --accent:#6FA3D2; --accent-ink:#0F1A24; --accent-soft:#213445;
  --ok:#6CC08F; --ok-soft:#1F3428; --warn:#E0A05A; --warn-soft:#3A2C1A; --bad:#E07A6E; }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100%}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--rule)}}
.side{border-right:1px solid var(--rule);background:var(--panel);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h1{font-size:19px;font-weight:600;margin:0;text-wrap:balance}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button:hover{background:var(--accent-soft)}
.nav button.on{background:var(--accent);color:var(--accent-ink)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:999px;background:var(--rule-soft);color:var(--ink-2);flex:none}
.pill.complete{background:var(--ok-soft);color:var(--ok)} .pill.signed{background:var(--accent-soft);color:var(--accent)}
.nav button.on .pill{background:rgba(255,255,255,.2);color:inherit}
.sec-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.btn{cursor:pointer;border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:8px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)} .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 9px;font-size:13px}
.status{font:12px var(--mono);color:var(--ink-3);margin-top:auto;padding-top:8px;border-top:1px solid var(--rule-soft)}
.status.warn{color:var(--warn)}
main{padding:24px clamp(16px,4vw,40px) 80px;max-width:960px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.head h2{margin:0;font-size:24px;font-weight:600;text-wrap:balance}
.head .sub{color:var(--ink-2);margin:2px 0 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:14px 0 22px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.section{display:flex;flex-direction:column;gap:18px}
.section h3{margin:10px 0 0;font-size:16px;font-weight:600;padding-top:14px;border-top:1px solid var(--rule-soft)}
.section h3:first-child{border-top:0;padding-top:0;margin-top:0}
.q{display:flex;flex-direction:column;gap:6px}
.q label{font-weight:500}
.q label .n{font:500 12px var(--mono);color:var(--accent);margin-right:8px}
.q .hint{color:var(--ink-2);font-size:13.5px;margin:-2px 0 0}
textarea,input[type=text],select{width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--panel);padding:9px 11px}
textarea{min-height:88px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font:500 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
td{padding:4px 4px;vertical-align:top;border-bottom:1px solid var(--rule-soft)}
td input,td textarea{min-height:0;padding:7px 9px;border-radius:4px}
td textarea{min-height:38px;resize:vertical}
td .x{all:unset;cursor:pointer;color:var(--ink-3);padding:8px 6px} td .x:hover{color:var(--bad)}
.row-actions{display:flex;gap:8px;margin-top:4px}
.callout{border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--panel);padding:14px 16px;border-radius:6px}
.callout p{margin:0 0 8px} .callout p:last-child{margin:0}
.callout ul{margin:6px 0 0;padding-left:20px}
.qcard{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.qcard .qh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qcard .qh b{font:500 13px var(--mono);color:var(--accent)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:13px}
.types div{border:1px solid var(--rule-soft);border-radius:6px;padding:8px 10px;background:var(--panel)}
.types b{display:block;font-weight:600;margin-bottom:2px}
pre{font:12.5px/1.45 var(--mono);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px;overflow:auto;max-height:60vh;margin:0}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{margin-top:5px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.muted{color:var(--ink-2);font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.nav button,.btn{transition:background .12s,border-color .12s}}
</style>

<div class="app">
  <aside class="side">
    <div>
      <div class="brand">Broadbridge Oil &amp; Gas</div>
      <h1>Case capture</h1>
    </div>
    <div class="nav" id="navTop">
      <button data-view="about"><span class="t">Read this first</span></button>
      <button data-view="workflow"><span class="t">A · Your workflow</span><span class="pill" id="pillA">—</span></button>
    </div>
    <div class="sec-label">Cases</div>
    <div class="nav" id="caseNav"></div>
    <button class="btn small" id="newCase">+ New case</button>
    <div class="sec-label">Export</div>
    <div class="nav"><button data-view="export"><span class="t">All records as JSON</span></button></div>
    <div class="status" id="status">Connecting…</div>
  </aside>
  <main id="main"></main>
</div>

<script>
// ---------- Schema (mirrors packs/oil-gas/schemas/case_record.json) ----------
const PART_A = [
  ['A1','When a distillation or vacuum problem lands on your desk, what are the first three things you do, in order?','We want the real sequence, not the textbook one.'],
  ['A2','Roughly how long does a typical case take from first call to a brief you would put your name on? Where does most of that time go?','Gathering data, waiting on people, calculating, writing, reviewing. Rough percentages are fine.'],
  ['A3','What data do you always ask for first, and where does it usually come from?','Historian, lab, operators, drawings, previous reports.'],
  ['A4','Which calculations or checks do you run on nearly every case?','Pressure-drop vs flow, flood/weep checks, ejector curves, heat and material balances, dew/bubble points. Name the ones that settle arguments.'],
  ['A5','What does a good written brief contain? What do reviewers or clients push back on when it is missing?',''],
  ['A6','What is the most common wrong diagnosis you see from less experienced engineers in this area, and what evidence usually exposes it?',''],
  ['A7','What must a tool never do or say? What would make you stop trusting it immediately?','Inventing a measurement, recommending a change to an operating limit, citing a source that does not exist.'],
  ['A8','Which parts of your workflow would you hand to an assistant, and which would you insist on doing yourself?',''],
  ['A9','Which references do you reach for (books, standards, vendor curves, internal notes)? Which could be licensed or are public?','Rights are recorded separately; this is to know what exists.'],
  ['A10','If the tool cut the time to an accepted brief by a quarter, what would that be worth to a client, and how would they measure it?',''],
];
const DECISION = [
  ['b1_trigger','B1','What first made this case worth looking at? What decision had to be made?','The reported symptom, who reported it, what was normal before.'],
  ['b2_operating_context','B2','What did the unit look like operationally at the time?','Configuration, feed and products, steady or transient, recent changes, constraints.'],
  ['b3_initial_info_and_requests','B3','What information did you have at the start, and what did you ask for first?','List the actual data requests. This becomes the missing information the model must learn to ask for.'],
  ['b5_initial_hypotheses','B5','What were the plausible explanations at that point, including the tempting wrong one?','Two to four. What made each plausible?'],
  ['b6_distrusted_or_missing','B6','What did you distrust or lack? Which instruments or records did you not believe, and why?',''],
];
const HINDSIGHT = [
  ['b8_turning_point','B8','Which single observation or calculation changed the ranking of explanations? Why did it outweigh the rest?','The diagnostic turning point. This is what we most want the model to learn to look for.'],
  ['b9_calculations','B9','What did you calculate? Inputs, units, assumptions, method, result, and how you checked it.','A photo or sheet is better than a description. Mark estimated numbers.'],
  ['b10_actions_taken','B10','What was actually tried, by whom, with what authorisation, and what happened? Include what did not work.','Historical fact, not a recommendation.'],
  ['b11_confidence','B11','How confident are you in the final explanation? Confirmed, inferred, disputed or unresolved, on what evidence?',''],
  ['b12_dangerous_wrong_answer','B12','What would a dangerous wrong answer have looked like? What should a junior engineer or a tool never have said?','This becomes a hard-fail criterion in testing.'],
  ['b13_lesson_and_limits','B13','What is the transferable lesson, and where does it stop applying?','The rule of thumb, its limits, a counterexample if you have one.'],
];
const IDENTITY = [
  ['title','Short title','text'],
  ['unit_service','Unit / service (generic label is fine)','text'],
  ['period','Approximate date or period','text'],
  ['record_type','Record type','select',['real_event','reconstructed','hypothetical']],
  ['confidentiality','Confidentiality and who may see it','text'],
  ['permitted_use','Permitted use','select',['training','testing_only','reference_only']],
];
const OBS_COLS = [['time','Time'],['variable_location','Variable and location'],['value_units_basis','Value, units, basis'],['source','Source'],['quality','Quality / doubts']];
const HYP_COLS = [['hypothesis','Hypothesis'],['evidence_for','Evidence for'],['evidence_against','Evidence against'],['discriminator','What would settle it']];
const EVI_COLS = [['item','Item'],['format','Format'],['available_at_decision_time','Available at decision time?'],['restriction','Sharing restriction']];
const Q_TYPES = [['brief','Brief','Assemble a diagnostic brief from decision-time evidence only.'],['missing_data','Missing data','Ask for the right next measurements.'],['calculation','Calculation','Run the check with correct units and assumptions.'],['grounded_explanation','Grounded explanation','Explain a mechanism citing only supplied sources.'],['abstention','Abstention','Refuse or escalate when evidence is insufficient.']];

const blankCase = () => ({
  schema:'broadbridge.case_record/1', case_id:'', family_id:'', status:'draft',
  identity:{title:'',unit_service:'',period:'',record_type:'real_event',confidentiality:'',permitted_use:'training'},
  decision_time:{b1_trigger:'',b2_operating_context:'',b3_initial_info_and_requests:'',observations:[],b5_initial_hypotheses:'',b6_distrusted_or_missing:''},
  hindsight:{hypotheses:[],b8_turning_point:'',b9_calculations:'',b10_actions_taken:'',b11_confidence:'',b12_dangerous_wrong_answer:'',b13_lesson_and_limits:''},
  evidence:[], questions:[], reviewer_signoff:{signed:false,name:'',date:''},
  created_at:new Date().toISOString(), updated_at:new Date().toISOString()
});
const blankQ = () => ({question_id:'',type:'brief',question:'',evidence_ids:'',reference_answer:'',tolerance:'',hard_fail_criteria:'',split:'dev'});

// ---------- State ----------
let db=null, cases={}, workflow={schema:'broadbridge.workflow/1',answers:{},updated_at:''}, view='about', openId=null, dirty=new Set(), timers={};
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main=$('#main'), statusEl=$('#status');
function setStatus(t,warn){statusEl.textContent=t;statusEl.classList.toggle('warn',!!warn);}
function nextCaseId(){const n=Object.keys(cases).length+1;return 'BB-'+String(n).padStart(3,'0');}

// ---------- Persistence ----------
async function connect(){
  try{ db = await claude.use('db'); }catch(e){ db=null; }
  if(!db){ setStatus('Not connected: nothing is being saved. Open this page from claude.ai while signed in.',true); return; }
  db.collection('cases').onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='removed'){delete cases[ch.doc.id];return;}
      if(ch.doc.metadata.hasPendingWrites||dirty.has(ch.doc.id)) return;
      cases[ch.doc.id]=ch.doc.data();
    });
    renderNav(); if(view==='case'&&openId&&!dirty.has(openId)) render();
  }, e=>setStatus('Live updates stopped ('+e.code+'). Reload the page.',true));
  const w=await db.doc('workflow/main').get(); if(w.exists) workflow=w.data();
  setStatus('Connected. Changes save automatically.'); renderNav(); render();
}
function scheduleSave(id){
  dirty.add(id); setStatus('Unsaved changes…');
  clearTimeout(timers[id]); timers[id]=setTimeout(()=>save(id),1200);
}
async function save(id){
  if(!db){ setStatus('Not connected: changes are only in this tab.',true); return; }
  try{
    if(id==='workflow'){ workflow.updated_at=new Date().toISOString(); await db.doc('workflow/main').set(workflow); }
    else { cases[id].updated_at=new Date().toISOString(); await db.doc('cases/'+id).set(cases[id]); }
    dirty.delete(id); setStatus('Saved '+new Date().toLocaleTimeString());
  }catch(e){ setStatus('Save failed ('+e.code+'). Your text is still in this tab; try again shortly.',true); }
}

// ---------- Rendering ----------
function renderNav(){
  const nav=$('#caseNav'); const ids=Object.keys(cases).sort();
  nav.innerHTML=ids.map(id=>{const c=cases[id];return `<button data-case="${id}" class="${view==='case'&&openId===id?'on':''}"><span class="t">${esc(id)} ${esc(c.identity?.title||'(untitled)')}</span><span class="pill ${c.status}">${c.status}</span></button>`;}).join('')||'<div class="muted" style="padding:6px 10px">No cases yet.</div>';
  document.querySelectorAll('#navTop button, .nav button[data-view]').forEach(b=>b.classList.toggle('on',view===b.dataset.view));
  const a=Object.values(workflow.answers||{}).filter(v=>v&&v.trim()).length; $('#pillA').textContent=a+'/10';
}
function qBlock(num,label,hint,name,val){return `<div class="q"><label for="${name}"><span class="n">${num}</span>${esc(label)}</label>${hint?`<p class="hint">${esc(hint)}</p>`:''}<textarea id="${name}" data-f="${name}">${esc(val)}</textarea></div>`;}
function table(cols,rows,key){
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td><textarea data-t="${key}" data-i="${i}" data-c="${c[0]}" aria-label="${c[1]}">${esc(r[c[0]])}</textarea></td>`).join('')}<td><button class="x" data-del="${key}" data-i="${i}" aria-label="Remove row">×</button></td></tr>`).join('')}</tbody></table></div><div class="row-actions"><button class="btn small" data-add="${key}">+ Row</button></div>`;
}
function render(){
  renderNav();
  if(view==='about') return main.innerHTML=aboutHtml();
  if(view==='workflow') return main.innerHTML=workflowHtml();
  if(view==='export') return main.innerHTML=exportHtml();
  if(view==='case'&&cases[openId]) return main.innerHTML=caseHtml(cases[openId]);
  view='about'; main.innerHTML=aboutHtml();
}
function aboutHtml(){return `
<div class="head"><div><h2>Read this first</h2><p class="sub">About five minutes. Then fill Part A once, and one case per session.</p></div></div>
<div class="section">
<div class="callout"><p>We are building a small language model that helps a process engineer produce a diagnostic brief faster. It does not replace the engineer. Its job is to pull together the evidence, list what is missing, run the standard checks, lay out the competing explanations, and hand the engineer a draft to correct and sign.</p>
<p>To build and test it we need real troubleshooting cases told the way you actually worked them: what you saw first, what you asked for, what you calculated, what you ruled out, and what would have been a dangerous wrong answer. Five to ten cases in distillation and vacuum systems is enough to start.</p></div>
<h3>What happens to your answers</h3>
<ul><li>Each case becomes one record that you approve before it is used.</li><li>From each case we derive 3–6 test questions with your reference answer, to score the model against (section C).</li><li>Approved cases become training examples. Cases you mark <b>testing only</b> are kept out of training entirely.</li></ul>
<h3>Ground rules</h3>
<ul><li>Sanitise as you see fit: site, client and unit names can be generic. Physics and numbers should stay real.</li><li>"Unknown" or "not recorded" is a valid answer. Please do not fill gaps with plausible guesses; the model must learn to say what it does not know.</li><li>Keep the sequence honest: what you knew at the time (B1–B6) versus what you learned afterwards (B7–B13).</li><li>Everything saves automatically as you type. Nothing is used until you tick the sign-off at the bottom of a case.</li></ul>
<h3>What happens after you fill this in</h3>
<ol>
<li><b>Your record becomes the test.</b> Each case's decision-time section (B1–B6) is what the model is shown. Your hindsight section (B7–B13) and section C are the answer key it is scored against. The model never sees the answer key.</li>
<li><b>We measure the model as it is today.</b> Before any training, the stock model plus a document search runs your cases and produces a draft brief. You score it: what it got right, what it missed, anything it said that it must never say.</li>
<li><b>Your scores decide what to train.</b> Where the draft is already good, we keep the search and skip training. Where it fails, approved cases marked <i>training</i> teach it; cases marked <i>testing only</i> stay hidden so the retest is fair.</li>
<li><b>You see the retest.</b> Same cases, same scoring, before and after. The model is accepted only if it improves without new critical errors.</li>
<li><b>Then it goes in front of an engineer's real work.</b> A pilot where the tool drafts the brief and the engineer corrects it. Their corrections come back here as new cases.</li>
</ol>
<h3>Suggested pace</h3>
<p class="muted">Part A: about 20 minutes, once. First case: 30–40 minutes, less thereafter. You can type directly, or talk it through on a call while Brad types, then correct the record yourself.</p>
</div>`;}
function workflowHtml(){return `
<div class="head"><div><h2>A · Your workflow today</h2><p class="sub">Once. Where an engineer's time goes, and what a signable brief must contain.</p></div></div>
<div class="section">${PART_A.map(([n,l,h])=>qBlock(n,l,h,'wf_'+n,workflow.answers?.[n]||'')).join('')}</div>`;}
function caseHtml(c){
  const idents=IDENTITY.map(([k,l,t,opts])=>`<div class="q"><label for="id_${k}">${l}</label>${t==='select'?`<select id="id_${k}" data-id="${k}">${opts.map(o=>`<option value="${o}" ${c.identity[k]===o?'selected':''}>${o.replace(/_/g,' ')}</option>`).join('')}</select>`:`<input type="text" id="id_${k}" data-id="${k}" value="${esc(c.identity[k])}">`}</div>`).join('');
  const qs=c.questions.map((q,i)=>`<div class="qcard"><div class="qh"><b>${esc(q.question_id||c.case_id+'-Q'+(i+1))}</b><button class="btn small" data-delq="${i}">Remove</button></div>
    <div class="grid2"><div class="q"><label>Type</label><select data-q="${i}" data-k="type">${Q_TYPES.map(t=>`<option value="${t[0]}" ${q.type===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div>
    <div class="q"><label>Split</label><select data-q="${i}" data-k="split">${['train','dev','locked_test'].map(s=>`<option value="${s}" ${q.split===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></div></div>
    <div class="q"><label>Question, as the engineer would ask it</label><textarea data-q="${i}" data-k="question">${esc(q.question)}</textarea></div>
    <div class="q"><label>Evidence supplied with the question (IDs or descriptions)</label><input type="text" data-q="${i}" data-k="evidence_ids" value="${esc(q.evidence_ids)}"></div>
    <div class="q"><label>Reference answer (Bill)</label><textarea data-q="${i}" data-k="reference_answer">${esc(q.reference_answer)}</textarea></div>
    <div class="grid2"><div class="q"><label>Numeric tolerance / units, if any</label><input type="text" data-q="${i}" data-k="tolerance" value="${esc(q.tolerance)}"></div>
    <div class="q"><label>Hard fail: an answer is wrong if it…</label><input type="text" data-q="${i}" data-k="hard_fail_criteria" value="${esc(q.hard_fail_criteria)}"></div></div></div>`).join('');
  return `
<div class="head"><div><h2>${esc(c.case_id)} ${esc(c.identity.title||'')}</h2><p class="sub">Family <span style="font-family:var(--mono)">${esc(c.family_id||c.case_id)}</span> · updated ${new Date(c.updated_at).toLocaleString()}</p></div>
<div style="display:flex;gap:8px"><select id="statusSel" class="btn small" aria-label="Status">${['draft','complete','signed'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn small" id="delCase">Delete</button></div></div>
<div class="tabs" role="tablist"><button class="on" data-tab="identity">Identity</button><button data-tab="decision">B · At the time</button><button data-tab="hindsight">B · In hindsight</button><button data-tab="evidence">Evidence</button><button data-tab="questions">C · Test questions</button><button data-tab="signoff">Sign-off</button></div>
<div class="section" data-pane="identity"><h3>Identity and permissions</h3><div class="grid2">${idents}</div>
  <div class="q"><label for="fam">Family ID</label><p class="hint">Cases that are retellings or variants of the same incident share a family, so they never straddle train and test.</p><input type="text" id="fam" data-fam value="${esc(c.family_id)}" placeholder="${esc(c.case_id)}"></div></div>
<div class="section" data-pane="decision" hidden><h3>What was known at decision time</h3>
  ${DECISION.slice(0,3).map(([k,n,l,h])=>qBlock(n,l,h,k,c.decision_time[k])).join('')}
  <h3>B4 · Observations at decision time</h3><p class="hint muted">One row per measurement. Say whether pressures are gauge or absolute; give the basis of each value (tag, lab, operator report, estimate).</p>
  ${table(OBS_COLS,c.decision_time.observations,'observations')}
  ${DECISION.slice(3).map(([k,n,l,h])=>qBlock(n,l,h,k,c.decision_time[k])).join('')}</div>
<div class="section" data-pane="hindsight" hidden><h3>B7 · Competing explanations</h3>
  ${table(HYP_COLS,c.hindsight.hypotheses,'hypotheses')}
  ${HINDSIGHT.map(([k,n,l,h])=>qBlock(n,l,h,k,c.hindsight[k])).join('')}</div>
<div class="section" data-pane="evidence" hidden><h3>B14 · Evidence you can share for this case</h3><p class="hint muted">Files are collected separately; list them here so we know what exists and its restrictions.</p>
  ${table(EVI_COLS,c.evidence,'evidence')}</div>
<div class="section" data-pane="questions" hidden><h3>C · Test questions from this case (3–6)</h3>
  <div class="types">${Q_TYPES.map(t=>`<div><b>${t[1]}</b>${t[2]}</div>`).join('')}</div>
  ${qs||'<p class="muted">No questions yet. Brad usually drafts these from section B; you correct the reference answer and set the tolerance.</p>'}
  <div class="row-actions"><button class="btn small" id="addQ">+ Question</button></div></div>
<div class="section" data-pane="signoff" hidden><h3>Reviewer sign-off</h3>
  <div class="q" style="max-width:360px"><label for="pu2">Permitted use for this case</label><p class="hint">Training: may teach the model. Testing only: hidden from training, used to score it. Reference only: never used as data.</p><select id="pu2" data-id="permitted_use">${['training','testing_only','reference_only'].map(o=>`<option value="${o}" ${c.identity.permitted_use===o?'selected':''}>${o.replace(/_/g,' ')}</option>`).join('')}</select></div>
  <p class="muted">Ticking this marks the written record as reviewed and usable as marked above. You can untick it at any time.</p>
  <label class="chk"><input type="checkbox" id="signed" ${c.reviewer_signoff.signed?'checked':''}><span>I have reviewed this case record. It is accurate to the best of my knowledge, contains nothing I am not permitted to share, and may be used as marked.</span></label>
  <div class="grid2"><div class="q"><label for="sname">Name</label><input type="text" id="sname" value="${esc(c.reviewer_signoff.name)}"></div><div class="q"><label for="sdate">Date</label><input type="text" id="sdate" value="${esc(c.reviewer_signoff.date)}" placeholder="YYYY-MM-DD"></div></div>
  <h3>This record as JSON</h3><pre id="caseJson">${esc(JSON.stringify(c,null,2))}</pre><div class="foot"><button class="btn small" id="copyJson">Copy JSON</button><span class="muted" id="copyMsg"></span></div></div>`;
}
function exportHtml(){
  const all={exported_at:new Date().toISOString(),workflow,cases:Object.values(cases)};
  return `<div class="head"><div><h2>All records</h2><p class="sub">${Object.keys(cases).length} case(s). This is exactly what the training harness reads.</p></div></div>
  <div class="foot" style="margin-bottom:12px"><button class="btn small" id="copyAll">Copy JSON</button><span class="muted" id="copyMsg"></span></div><pre>${esc(JSON.stringify(all,null,2))}</pre>`;
}

// ---------- Events ----------
document.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.view){view=b.dataset.view;openId=null;render();return;}
  if(b.dataset.case){view='case';openId=b.dataset.case;render();return;}
  if(b.id==='newCase'){const c=blankCase();c.case_id=nextCaseId();c.family_id=c.case_id;cases[c.case_id]=c;view='case';openId=c.case_id;render();scheduleSave(c.case_id);return;}
  if(b.dataset.tab){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==b.dataset.tab);return;}
  const c=cases[openId];
  if(b.dataset.add){const key=b.dataset.add;const arr=key==='observations'?c.decision_time.observations:key==='hypotheses'?c.hindsight.hypotheses:c.evidence;const cols=key==='observations'?OBS_COLS:key==='hypotheses'?HYP_COLS:EVI_COLS;arr.push(Object.fromEntries(cols.map(x=>[x[0],''])));rerenderPane();scheduleSave(openId);return;}
  if(b.dataset.del){const key=b.dataset.del;const arr=key==='observations'?c.decision_time.observations:key==='hypotheses'?c.hindsight.hypotheses:c.evidence;arr.splice(+b.dataset.i,1);rerenderPane();scheduleSave(openId);return;}
  if(b.id==='addQ'){const q=blankQ();q.question_id=c.case_id+'-Q'+(c.questions.length+1);c.questions.push(q);rerenderPane('questions');scheduleSave(openId);return;}
  if(b.dataset.delq){c.questions.splice(+b.dataset.delq,1);rerenderPane('questions');scheduleSave(openId);return;}
  if(b.id==='delCase'){ if(b.textContent!=='Confirm delete'){b.textContent='Confirm delete';b.style.color='var(--bad)';setTimeout(()=>{b.textContent='Delete';b.style.color='';},4000);return;} delete cases[openId]; if(db) try{await db.doc('cases/'+openId).delete();}catch(err){} view='about';openId=null;render();return;}
  if(b.id==='copyJson'||b.id==='copyAll'){const txt=b.id==='copyJson'?JSON.stringify(c,null,2):JSON.stringify({exported_at:new Date().toISOString(),workflow,cases:Object.values(cases)},null,2);const m=$('#copyMsg');try{await navigator.clipboard.writeText(txt);m.textContent='Copied.';}catch(err){const pre=b.closest('main').querySelector('pre');const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent='Select-all applied; press Ctrl/Cmd+C.';}setTimeout(()=>m.textContent='',3000);}
});
function rerenderPane(tab){const cur=tab||$('.tabs button.on')?.dataset.tab||'identity';main.innerHTML=caseHtml(cases[openId]);document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===cur));document.querySelectorAll('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==cur);}
document.addEventListener('input',e=>{
  const t=e.target; if(view==='workflow'&&t.dataset.f){workflow.answers=workflow.answers||{};workflow.answers[t.dataset.f.slice(3)]=t.value;scheduleSave('workflow');renderNav();return;}
  const c=cases[openId]; if(!c) return;
  if(t.dataset.id!==undefined){c.identity[t.dataset.id]=t.value;if(t.dataset.id==='title')renderNav();if(t.dataset.id==='permitted_use')document.querySelectorAll('[data-id=permitted_use]').forEach(x=>{if(x!==t)x.value=t.value;});}
  else if(t.dataset.fam!==undefined){c.family_id=t.value;}
  else if(t.dataset.f){ if(t.dataset.f in c.decision_time) c.decision_time[t.dataset.f]=t.value; else c.hindsight[t.dataset.f]=t.value; }
  else if(t.dataset.t){const arr=t.dataset.t==='observations'?c.decision_time.observations:t.dataset.t==='hypotheses'?c.hindsight.hypotheses:c.evidence;arr[+t.dataset.i][t.dataset.c]=t.value;}
  else if(t.dataset.q!==undefined){c.questions[+t.dataset.q][t.dataset.k]=t.value;}
  else if(t.id==='signed'){c.reviewer_signoff.signed=t.checked;if(t.checked&&c.status!=='signed'){c.status='signed';$('#statusSel').value='signed';renderNav();}}
  else if(t.id==='sname'){c.reviewer_signoff.name=t.value;} else if(t.id==='sdate'){c.reviewer_signoff.date=t.value;}
  else if(t.id==='statusSel'){c.status=t.value;renderNav();}
  else return;
  const pre=$('#caseJson'); if(pre) pre.textContent=JSON.stringify(c,null,2);
  scheduleSave(openId);
});
window.addEventListener('beforeunload',()=>{dirty.forEach(id=>save(id));});
render(); connect();
</script>
